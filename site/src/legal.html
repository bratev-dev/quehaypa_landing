<!DOCTYPE html>

<title>¿Qué hay pa'?</title>
<meta name="theme-color" content="#FCD413">
<meta name="robots" content="index, follow">
<script>
(function () {
  var m, l;
  try { m = localStorage.getItem('qhp-mode'); l = localStorage.getItem('qhp-lang'); } catch (e) {}
  if (m !== 'light' && m !== 'dark') m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if (l !== 'es' && l !== 'en') l = /^es\b/i.test(navigator.language || 'es') ? 'es' : 'en';
  document.documentElement.setAttribute('data-mode', m);
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
